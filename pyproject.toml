[project]
name = "bharat"
version = "0.3.0"
description = "An Indian postal directory API with reproducible dataset imports."
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<5.3", "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1", "gunicorn>=23; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["ruff>=0.11", "pytest>=8", "pytest-django>=4.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
